name: Create S3 Bucket via AWS OIDC

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'Name of the S3 Bucket to create'
        required: true
        type: string
      aws_region:
        description: 'AWS Region'
        required: false
        default: 'ap-south-1'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  create-s3-bucket:
    name: Create S3 Bucket
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Create S3 Bucket and Generate Step Summary
        run: |
          BUCKET_NAME="${{ inputs.bucket_name }}"
          AWS_REGION="${{ inputs.aws_region }}"

          echo "Checking status of bucket: ${BUCKET_NAME}"

          if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            STATUS="Already Exists"
            MESSAGE="Bucket \`${BUCKET_NAME}\` already exists and is accessible."
          else
            echo "Creating bucket ${BUCKET_NAME} in region ${AWS_REGION}..."
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              CREATE_OUTPUT=$(aws s3api create-bucket --bucket "${BUCKET_NAME}" --region "${AWS_REGION}" 2>&1)
              EXIT_CODE=$?
            else
              CREATE_OUTPUT=$(aws s3api create-bucket --bucket "${BUCKET_NAME}" --region "${AWS_REGION}" --create-bucket-configuration LocationConstraint="${AWS_REGION}" 2>&1)
              EXIT_CODE=$?
            fi

            if [ ${EXIT_CODE} -eq 0 ]; then
              STATUS="Created Successfully"
              MESSAGE="Bucket \`${BUCKET_NAME}\` was created successfully."
            else
              STATUS="Failed"
              MESSAGE="Failed to create bucket \`${BUCKET_NAME}\`."
              
              # Generate failure step summary
              {
                echo "## ❌ S3 Bucket Creation Failed"
                echo ""
                echo "| Parameter | Value |"
                echo "| --- | --- |"
                echo "| **Bucket Name** | \`${BUCKET_NAME}\` |"
                echo "| **AWS Region** | \`${AWS_REGION}\` |"
                echo "| **Status** | ❌ ${STATUS} |"
                echo ""
                echo "### Error Details"
                echo "\`\`\`text"
                echo "${CREATE_OUTPUT}"
                echo "\`\`\`"
              } >> $GITHUB_STEP_SUMMARY

              exit 1
            fi
          fi

          # Generate success step summary
          {
            echo "## 🚀 S3 Bucket Deployment Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| **Bucket Name** | \`${BUCKET_NAME}\` |"
            echo "| **AWS Region** | \`${AWS_REGION}\` |"
            echo "| **Status** | ✅ ${STATUS} |"
            echo ""
            echo "> ${MESSAGE}"
          } >> $GITHUB_STEP_SUMMARY